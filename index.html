<span class="tag">DONANIM - 12 DK OKUMA</span>
<h3>Gelecegin Yari Iletken Teknolojileri ve RAM Mimari Mimarisi</h3>
<div class="meta">Yazar: Fazecup Tech Ekibi | Guncelleme: Eylul 2026 | Kategori: Donanim</div>
<div class="toc"><b>Icerik:</b> 1. Giris 2. Yari iletken olceklenme 3. DDR5 ve LPDDR5X 4. HBM ve 3D bellek 5. CXL 6. SSS</div>
<p>Yari iletken endustrisi, 3nm ve 2nm uretim surecleriyle guc verimliliginde yeni bir doneme girdi. Gate-All-Around (GAA) transistorler kacagi azaltirken, chiplet tasarimlar bellek bant genisligini islemciye yakinlastiriyor. Bu makalede RAM mimarisinin nasil evrildigini inceliyoruz.</p>
<h4>1. Olceklenme Neden Yavasladi?</h4>
<p>Moore Yasasi yavaslarken endustri 3D istiflemeye yoneldi. EUV litografi, SRAM hucrelerini kuculterek onbellek yogunlugunu artirdi. Sonuc: daha fazla cekirdek, daha dusuk watt basina performans maliyeti.</p>
<h4>2. DDR5 ve LPDDR5X Gercegi</h4>
<ul><li><b>DDR5-5600+:</b> Cift 32-bit alt kanal, on-die ECC, 1.1V calisma.</li><li><b>LPDDR5X:</b> 8533 MT/s hiz, mobil ve ince dizustulerde standart.</li><li><b>Secim:</b> Oyun icin CL30 DDR5, icerik uretimi icin 64GB+ kapasite oncelikli.</li></ul>
<h4>3. HBM: Yapay Zekanin Bellek Motoru</h4>
<p>HBM3e 1.2TB/s uzeri bant genisligi sunar. GPU ve AI hizlandiricilar bellegi islemci paketine tasiyarak gecikmeyi dusurur. 2026 sonrasi HBM4 ile 2048-bit arayuzler yayginlasacak.</p>
</article>

<article class="card article">
<span class="tag">ISLETIM SISTEMI - 10 DK OKUMA</span>
<h3>Bagimsiz Isletim Sistemi (OS) Mimarileri ve Kernel Yapilari</h3>
<div class="meta">Yazar: Fazecup Tech Ekibi | Guncelleme: Eylul 2026 | Kategori: Yazilim</div>
<div class="toc"><b>Icerik:</b> 1. Kernel nedir 2. Monolitik vs Mikro 3. Hibrit 4. Zamanlama 5. Guvenlik 6. SSS</div>
<p>Kernel, donanim ile yazilim arasindaki ko­prudur. Surec yonetimi, bellek yonetimi, dosya sistemi ve aygit suruculeri cekirdegin temel gorevleridir. Dogru mimari secimi performansi ve guvenligi belirler.</p>
<h4>1. Monolitik Kernel (Linux)</h4>
<p>Tum servisler tek adres alaninda calisir. Avantaj: hizli sistem cagrilari. Dezavantaj: bir surucu hatasi sistemi coker­tebilir. Linux bu riski moduler yapi ve eBPF ile azaltir.</p>
<h4>2. Mikro Kernel (seL4, Zircon)</h4>
<p>Sadece zamanlama ve IPC cekirdekte; suruculer kullanici alanında. Avantaj: yuksek izolasyon. Ornek: QNX otomativde, seL4 formal dogrulamali guvenlikte one cikar.</p>
<h4>3. Hibrit Kernel (Windows NT, XNU)</h4>
<p>Performans ile modulari­teyi dengeler. Windows NT hibrit cekirdek + HAL katmani kullanir; macOS XNU Mach + BSD bilesimidir.</p>
<details><summary>SSS: Hangi kernel daha hizli?</summary><p>Monolitik kernel sistem cagrilarinda genellikle daha hizlidir; mikro kernel guvenlik ve kararlilikta one cikar. Hibrit ikisini dengeler.</p></details>
<details><summary>SSS: Kendi OS projeme nereden baslamaliyim?</summary><p>Multiboot + basit zamanlayici + seri port loglama ile baslayin. Sonra fiziksel bellek yoneticisi ve round-robin zamanlayici ekleyin.</p></details>
</article>

window.addEventListener('resize',fillSys);
// Arama
$('siteSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();const items=[['Metin Analizcisi','#araclar'],['Sifre Olusturucu','#araclar'],['Sistem Bilgisi','#araclar'],['QR Kod','#araclar'],['Kredi Hesaplayici','#araclar'],['VKI','#araclar'],['KDV','#finans'],['RAM Mimarisi','#donanim'],['Kernel / OS','#makaleler'],['Para Kazanma','#makaleler']];const f=items.filter(x=>x[0].toLowerCase().includes(q));$('searchRes').innerHTML=q===''?'Orn: sifre, RAM, kernel...':(f.length?f.map(x=>'<a href="'+x[1]+'">'+x[0]+'</a>').join(' | '):'Sonuc bulunamadi');});
function showTool(id,btn){document.querySelectorAll('.tool-pane').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('#toolTabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');}
// QR (gercek taranabilir QR - goqr.me ucretsiz API)
function makeQR(){const t=($('qrText').value||'https://fazecup.tech').trim();$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(t);$('qrMsg').textContent='QR uretildi: '+t.slice(0,60);}
function dlQR(){const a=document.createElement('a');a.download='fazecup-qr.png';a.href=$('qrImg').src;a.target='_blank';a.click();}
// Renk
function hexRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
$('colPick').addEventListener('input',e=>{const v=e.target.value.toUpperCase();$('colHex').textContent=v;const r=hexRgb(v);$('colRgb').textContent='rgb('+r.join(', ')+')';});
function copyCol(){navigator.clipboard.writeText($('colHex').textContent).then(()=>alert('Renk kopyalandi'));}
function randPal(){const row=$('palRow');row.innerHTML='';for(let i=0;i<5;i++){const c='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');const d=document.createElement('div');d.style.cssText='background:'+c+';border-radius:8px;padding:22px 6px;text-align:center;font-size:.7rem;color:#fff;cursor:pointer';d.textContent=c;d.onclick=()=>{navigator.clipboard.writeText(c);alert(c+' kopyalandi');};row.appendChild(d);}}
// Base64 (Turkce uyumlu)
function b64e(){try{$('b64Out').value=btoa(unescape(encodeURIComponent($('b64In').value)));}catch(e){$('b64Out').value='Hata: '+e.message;}}
function b64d(){try{$('b64Out').value=decodeURIComponent(escape(atob($('b64In').value.trim())));}catch(e){$('b64Out').value='Gecersiz Base64';}}
function copyB64(){navigator.clipboard.writeText($('b64Out').value).then(()=>alert('Kopyalandi'));}
// Kredi
function calcKredi(){const P=parseFloat($('krTutar').value)||0,r=(parseFloat($('krFaiz').value)||0)/100,n=parseInt($('krVade').value)||1,m=parseFloat($('krMasraf').value)||0;const taksit=r===0?P/n:P*r/(1-Math.pow(1+r,-n));const toplam=taksit*n+m;$('krTaksit').textContent=taksit.toLocaleString('tr-TR',{maximumFractionDigits:0})+' TL';$('krToplam').textContent=toplam.toLocaleString('tr-TR',{maximumFractionDigits:0})+' TL';$('krMaliyet').textContent=(toplam-P).toLocaleString('tr-TR',{maximumFractionDigits:0})+' TL';}
function calcVKI(){const b=(parseFloat($('vBoy').value)||0)/100,k=parseFloat($('vKilo').value)||0;if(!b)return;const v=k/(b*b);$('vSonuc').textContent=v.toFixed(1);$('vDurum').textContent=v<18.5?'Zayif':v<25?'Normal':v<30?'Kilolu':'Obez';$('vIdeal').textContent=(22*b*b).toFixed(0)+' kg';}
function calcYas(){const d=new Date($('yasDate').value);if(isNaN(d))return;const now=new Date();let y=now.getFullYear()-d.getFullYear();const md=now.getMonth()-d.getMonth();if(md<0||(md===0&&now.getDate()<d.getDate()))y--;const gun=Math.floor((now-d)/86400000);$('yasYil').textContent=y;$('yasGun').textContent=gun.toLocaleString('tr-TR');const m=d.getMonth()+1,dd=d.getDate();const burc=(m==1&&dd>=20||m==2&&dd<=18)?'Kova':(m==2&&dd>=19||m==3&&dd<=20)?'Balik':(m==3&&dd>=21||m==4&&dd<=19)?'Koc':(m==4&&dd>=20||m==5&&dd<=20)?'Boga':(m==5&&dd>=21||m==6&&dd<=20)?'Ikizler':(m==6&&dd>=21||m==7&&dd<=22)?'Yengec':(m==7&&dd>=23||m==8&&dd<=22)?'Aslan':(m==8&&dd>=23||m==9&&dd<=22)?'Basak':(m==9&&dd>=23||m==10&&dd<=22)?'Terazi':(m==10&&dd>=23||m==11&&dd<=21)?'Akrep':(m==11&&dd>=22||m==12&&dd<=21)?'Yay':'Oglak';$('yasBurc').textContent=burc;}
function calcKDV(){const t=parseFloat($('kdvT').value)||0,o=parseFloat($('kdvO').value)||20,m=$('kdvM').value;let net,tax,brut;if(m==='ekle'){net=t;tax=t*o/100;brut=t+tax;}else{brut=t;net=t/(1+o/100);tax=brut-net;}$('kdvNet').textContent=net.toFixed(2)+' TL';$('kdvTax').textContent=tax.toFixed(2)+' TL';$('kdvBrut').textContent=brut.toFixed(2)+' TL';}
// Kronometre
let kT=0,kInt=null;function fmtK(ms){const d=Math.floor(ms/100);return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+(d%10);}
function kStart(){if(kInt)return;const s=Date.now()-kT;kInt=setInterval(()=>{kT=Date.now()-s;$('kronoTxt').textContent=fmtK(kT);},100);}
function kStop(){clearInterval(kInt);kInt=null;}function kReset(){kStop();kT=0;$('kronoTxt').textContent='00:00.0';}
// Modal + cerez
function openModal(id){$(id).classList.add('open');}
function closeModal(id){$(id).classList.remove('open');}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
function acceptCookies(){localStorage.setItem('fz_cookie','1');$('cookieBar').classList.remove('show');}
window.addEventListener('load',()=>{if(!localStorage.getItem('fz_cookie'))setTimeout(()=>$('cookieBar').classList.add('show'),1200);analyze();genPass();fillSys();makeQR();calcKredi();calcVKI();calcKDV();const r=hexRgb($('colPick').value);$('colRgb').textContent='rgb('+r.join(', ')+')';randPal();});
function subscribe(){const v=$('nlMail').value;if(!v||!v.includes('@')){$('nlMsg').textContent='Gecerli e-posta girin.';return;}$('nlMsg').textContent='Kayit alindi, tesekkurler!';$('nlMail').value='';}
window.addEventListener('scroll',()=>{const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight)*100;$('pBar').style.width=p+'%';$('toTop').style.display=h.scrollTop>600?'block':'none';});
</script>
